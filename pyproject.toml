[project]
name = "quotacli-mac"
version = "0.1.0"
description = "Terminal quota tracker for Claude Code, Cursor, Codex, Antigravity, and Grok"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Lokesh Devnani", email = "lokeshdevnani@gmail.com" }]
keywords = ["cli", "claude-code", "cursor", "codex", "antigravity", "grok", "quota", "rate-limit", "usage"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "httpx>=0.27",
    "pyobjc-framework-Security>=10.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/lokeshdevnani/quotacli"
Repository = "https://github.com/lokeshdevnani/quotacli"
Issues = "https://github.com/lokeshdevnani/quotacli/issues"

[project.scripts]
quotacli = "quotacli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "build", "twine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotacli"]
